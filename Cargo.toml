[package]
name = "time-manager"
version = "0.1.0"
edition = "2024"

[lib]
name = "time_manager"
path = "src/lib.rs"

[[bin]]
name = "time-manager"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
thiserror = "2"
walkdir = "2"
fsrs = "5"
iced = { version = "0.14", features = ["tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
