[package]
name = "time-manager"
version = "0.1.0"
edition = "2024"

[lib]
name = "time_manager"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
thiserror = "2"
walkdir = "2"
uuid = { version = "1", features = ["v4", "serde"] }
fsrs = "5"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"

[dev-dependencies]
tempfile = "3"
